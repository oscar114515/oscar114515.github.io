<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梁喆同學 · 作品集</title>
    <script async src="https://ss.mrmnd.com/static/8e6e2b64-e447-4835-9383-b3690481621b.js"></script>
    <meta name="mnd-ver" content="tlr5gwjihbdf9nqy1inwfa" />
    <meta name="google-site-verification" content="Fo87PV4l8qknvf02W0c2541TD76fU8hgqG0DtjcAA_Y">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7041222551434229" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
</head>
<body>
    <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,sans-serif;background:#f0f2f5;">
        <div style="text-align:center;">
            <div style="font-size:48px;margin-bottom:16px;">🌐</div>
            <p style="font-size:18px;color:#666;">正在跳轉到繁體中文版本...</p>
            <p style="font-size:14px;color:#999;margin-top:8px;">如果沒有自動跳轉，<a href="/zh/index.html" style="color:#4a90d9;">請點擊這裡</a></p>
        </div>
    </div>
    <script>
        // 根據 Cookie 和浏览器语言自动跳转
        (function() {
            const cookies = document.cookie.split(';');
            let lang = 'zh';
            for (const c of cookies) {
                const [k, v] = c.trim().split('=');
                if (k === 'oscar_lang') { lang = v; break; }
            }
            // 如果没有 Cookie，根据浏览器语言检测
            if (lang === 'zh') {
                const browserLang = navigator.language || navigator.userLanguage;
                if (browserLang.startsWith('zh')) {
                    // 简体中文浏览器跳转到 cn
                    if (browserLang.includes('CN') || browserLang.includes('SC')) lang = 'cn';
                    else lang = 'zh'; // 默认繁体
                } else if (browserLang.startsWith('en')) lang = 'en';
                else if (browserLang.startsWith('ko')) lang = 'ko';
                else if (browserLang.startsWith('ja')) lang = 'ja';
            }
            const saved = localStorage.getItem('oscar_current_lang');
            if (saved) lang = saved;
            window.location.href = '/' + lang + '/index.html';
        })();
    </script>
</body>
</html>
