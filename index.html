<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梁喆同學 · 作品集</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #f8f9fa;
            padding: 0.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            z-index: 1000;
        }
        .logo a { display: flex; align-items: center; }
        .logo img { height: 50px; width: auto; }
        .nav-right { display: flex; align-items: center; gap: 1.2rem; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: #2c3e50; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #667eea; }
        .hamburger { display: none; flex-direction: column; cursor: pointer; gap: 5px; }
        .hamburger span { width: 25px; height: 3px; background: #2c3e50; border-radius: 3px; }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hamburger { display: flex; }
        }
        .main-content {
            margin-top: 80px;
            max-width: 1200px;
            width: 100%;
            padding: 40px 20px;
        }
        .hero {
            text-align: center;
            margin-bottom: 60px;
        }
        .hero h1 {
            font-size: 3rem;
            color: #0b1b33;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .hero .highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .subtitle {
            font-size: 1.25rem;
            color: #4a6a8e;
            margin-bottom: 24px;
        }
        .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 40px;
            border-radius: 2px;
        }
        .section-label {
            font-size: 1.5rem;
            color: #0b1b33;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
        }
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }
        .about-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .about-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .about-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .about-card .card-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .about-card .card-title {
            font-size: 1.25rem;
            color: #0b1b33;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .about-card .card-desc {
            font-size: 0.95rem;
            color: #4a6a8e;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #6a7e9b;
            font-size: 0.9rem;
        }
        /* Maintenance banner */
        .maintenance-banner {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            padding: 12px 20px;
            text-align: center;
            font-weight: 600;
            position: fixed;
            top: 61px;
            left: 0;
            right: 0;
            z-index: 999;
        }
        .main-content {
            margin-top: 120px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="#">
                <img src="https://i.postimg.cc/Z520m4jx/e1fb8ec8ae1db1ac50505adac82398e4.jpg" alt="Logo">
            </a>
        </div>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="#">首頁</a></li>
                <li><a href="#">作品</a></li>
                <li><a href="#">關於</a></li>
            </ul>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="maintenance-banner">
        🔧 網站暫停營運 - 項目正在修理中
    </div>

    <div class="main-content">
        <div class="hero">
            <h1>梁喆同學 <span class="highlight">· 作品集</span></h1>
            <p class="subtitle">網站正在進行維護，敬請稍候</p>
            <div class="divider"></div>
        </div>

        <div class="section-label">系統狀態</div>
        <div class="about-grid">
            <div class="about-card" style="background-image: url(https://images.unsplash.com/photo-1581291518857-4e2773c5b089?w=400&h=300&fit=crop);">
                <div class="card-icon">⚠️</div>
                <div class="card-title">網站暫停營運</div>
                <div class="card-desc">項目正在修理中<br>我們正在進行維護和升級<br>敬請稍候</div>
            </div>
        </div>

        <div class="footer">© 2026 梁喆同學 · 用 ❤️ 製作</div>
    </div>

    <script>
        function toggleMenu() {
            const nav = document.querySelector('.nav-links');
            nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
        }
    </script>
</body>
</html>
