<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 網站暫停營運 - OscarTools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: rotate 4s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .subtitle {
            color: #e94560;
            font-size: 1.25rem;
            margin-bottom: 24px;
            font-weight: 500;
        }
        p {
            color: #a0a0a0;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .status {
            display: inline-block;
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
            color: #e94560;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <h1>網站暫停營運</h1>
        <p class="subtitle">項目正在修理中</p>
        <p>我們正在進行網站維護和升級，敬請稍候。感謝您的耐心！</p>
        <span class="status">⏳ 維修中</span>
        <div class="footer">
            <p>© 2026 OscarTools. 版權所有</p>
        </div>
    </div>
</body>
</html>
