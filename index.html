<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 網站暫停營運 - OscarTools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #f8f9fa;
            padding: 0.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            z-index: 1000;
        }
        .logo a { display: flex; align-items: center; }
        .logo img { height: 50px; width: auto; }
        .nav-right { display: flex; align-items: center; gap: 1.2rem; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: #2c3e50; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #667eea; }
        .hamburger { display: none; flex-direction: column; cursor: pointer; gap: 5px; }
        .hamburger span { width: 25px; height: 3px; background: #2c3e50; border-radius: 3px; }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hamburger { display: flex; }
        }
        .main-content {
            margin-top: 80px;
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: rotate 4s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .subtitle {
            color: #e94560;
            font-size: 1.25rem;
            margin-bottom: 24px;
            font-weight: 500;
        }
        p {
            color: #a0a0a0;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .status {
            display: inline-block;
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
            color: #e94560;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="#">
                <img src="https://i.postimg.cc/Z520m4jx/e1fb8ec8ae1db1ac50505adac82398e4.jpg" alt="Logo">
            </a>
        </div>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="#">首頁</a></li>
                <li><a href="#">作品</a></li>
                <li><a href="#">關於</a></li>
            </ul>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="icon">🔧</div>
            <h1>網站暫停營運</h1>
            <p class="subtitle">項目正在修理中</p>
            <p>我們正在進行網站維護和升級，敬請稍候。感謝您的耐心！</p>
            <span class="status">⏳ 維修中</span>
            <div class="footer">
                <p>© 2026 OscarTools. 版權所有</p>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const nav = document.querySelector('.nav-links');
            nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
        }
    </script>
</body>
</html>
