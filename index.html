<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梁喆同學 · 作品集</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 引入 Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow-x: hidden;
        }

        /* ===== 導航欄 ===== */
        .navbar-wrapper {
            position: fixed; top: 0; left: 0; width: 100%;
            transform: translateY(-100%);
            animation: slideDown 0.5s ease-out forwards;
            z-index: 4000;
        }
        @keyframes slideDown {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(0); }
        }
        .navbar {
            background: rgba(15, 15, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            width: 100%;
        }
        .logo a { display: flex; align-items: center; }
        .logo img { height: 42px; width: auto; display: block; }
        .nav-right { display: flex; align-items: center; gap: 1.2rem; }
        .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: rgba(255,255,255,0.75); font-size: 0.95rem; cursor: pointer; transition: color 0.2s; }
        .nav-links a:hover { color: #fff; }

        .avatar-btn {
            width: 38px; height: 38px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer; background: rgba(255,255,255,0.08); padding: 0; overflow: hidden;
            transition: border-color 0.2s; flex-shrink: 0;
        }
        .avatar-btn:hover { border-color: rgba(255,255,255,0.4); }
        .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .avatar-btn .default-avatar {
            width: 100%; height: 100%; display: flex; align-items: center;
            justify-content: center; background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6); font-size: 1rem;
        }

        .auth-link {
            text-decoration: none; color: #fff; font-size: 0.95rem;
            cursor: pointer; padding: 7px 20px; border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.3); transition: all 0.2s ease;
            background: rgba(255,255,255,0.08);
        }
        .auth-link:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
        .auth-link.logout { border-color: rgba(239,68,68,0.5); color: #f87171; }
        .auth-link.logout:hover { background: rgba(239,68,68,0.15); }

        /* ===== 背景粒子動畫 ===== */
        .bg-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .particle {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,107,53,0.3) 0%, transparent 70%);
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* ===== 主容器 ===== */
        .container {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 120px 20px 60px;
            position: relative; z-index: 1;
            min-height: 100vh;
        }

        /* ===== 維修橫幅 ===== */
        .maintenance-banner {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(90deg, rgba(255,107,53,0.2), rgba(247,147,30,0.2));
            border: 1px solid rgba(255,107,53,0.3);
            color: #ffb347; padding: 8px 20px;
            border-radius: 50px; font-size: 0.85rem;
            font-weight: 500; letter-spacing: 0.05em;
            margin-bottom: 40px;
            animation: pulseBanner 2s ease-in-out infinite;
        }
        @keyframes pulseBanner {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.2); }
            50% { box-shadow: 0 0 20px 5px rgba(255,107,53,0.1); }
        }

        /* ===== 核心動畫圖標 ===== */
        .hero-gear {
            width: 120px; height: 120px; margin: 0 auto 40px;
            position: relative;
        }
        .gear {
            position: absolute; color: rgba(255,107,53,0.9);
            animation: spinGear linear infinite;
        }
        .gear-lg { width: 80px; height: 80px; top: 0; left: 20px; animation-duration: 4s; }
        .gear-sm { width: 50px; height: 50px; bottom: 0; right: 5px; animation-duration: 3s; animation-direction: reverse; }
        @keyframes spinGear { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ===== Hero 區 ===== */
        .hero-title {
            font-size: 3.5rem; font-weight: 800;
            text-align: center; margin: 0 0 16px 0;
            line-height: 1.2; letter-spacing: -0.02em;
        }
        .title-line { display: block; }
        .title-accent {
            background: linear-gradient(135deg, #ff6b35, #f7931e, #ffb347);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-desc {
            font-size: 1.15rem; color: rgba(255,255,255,0.55);
            text-align: center; margin: 0 0 40px 0;
            max-width: 500px; line-height: 1.7;
        }

        /* ===== 狀態徽章 ===== */
        .status-badge {
            display: inline-flex; align-items: center; gap: 10px;
            background: rgba(255,107,53,0.1);
            border: 1px solid rgba(255,107,53,0.3);
            color: #ffb347; padding: 12px 24px;
            border-radius: 50px; font-size: 0.95rem;
            font-weight: 500; margin-bottom: 60px;
        }
        .status-dot {
            width: 10px; height: 10px; background: #ff6b35;
            border-radius: 50%; animation: pulseDot 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(255,107,53,0.5);
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* ===== 信息卡片 ===== */
        .maintenance-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; max-width: 860px; width: 100%;
        }
        .maint-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 36px 24px;
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .maint-card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,107,53,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .maint-icon {
            font-size: 2.8rem; margin-bottom: 18px;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(255,107,53,0.3));
        }
        .maint-card h3 {
            font-size: 1.1rem; color: #fff;
            margin: 0 0 10px 0; font-weight: 600;
        }
        .maint-card p {
            font-size: 0.9rem; color: rgba(255,255,255,0.5);
            margin: 0; line-height: 1.7;
        }

        /* ===== 頁尾 ===== */
        .site-footer {
            text-align: center; padding: 40px 0 20px;
            color: rgba(255,255,255,0.3); font-size: 0.85rem;
            margin-top: 60px;
        }

        /* ===== 彈窗樣式 ===== */
        .modal-overlay, .auth-modal-overlay, .admin-modal-overlay, .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center;
            z-index: 3000; background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .auth-modal-overlay { z-index: 5000; }
        .admin-modal-overlay { z-index: 6000; }
        .loading-overlay { z-index: 9999; }
        .modal-box, .auth-modal-box, .admin-modal-box, .loading-box {
            background: linear-gradient(145deg, #1e1e3a, #16162a);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 2rem;
            width: 90%; max-width: 400px; cursor: default;
            animation: fadeIn 0.3s ease;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .admin-modal-box { max-width: 550px; max-height: 80vh; overflow-y: auto; }
        .loading-box { text-align: center; min-width: 180px; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .modal-box .title, .auth-modal-box .brand h2 { font-size: 1.1rem; font-weight: 500; color: #fff; margin-bottom: 16px; }
        .modal-box .divider, .auth-modal-box .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 14px 0; }
        .contact-info, .auth-modal-box .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
        .qq-icon { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        .qq-number { font-size: 1.6rem; font-weight: bold; color: #fff; letter-spacing: 2px; }
        .qq-label { font-size: 0.85rem; color: rgba(255,255,255,0.5); }
        .platform-grid-small { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
        .platform-btn-small {
            display: block; width: 100%; padding: 12px 0;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 40px;
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8);
            font-size: 0.95rem; font-weight: 500; cursor: pointer;
            text-align: center; transition: 0.15s; font-family: sans-serif;
        }
        .platform-btn-small:active { background: rgba(255,255,255,0.12); transform: scale(0.97); }
        .platform-btn-small.bili { color: #00d4ff; border-color: rgba(0,212,255,0.2); }
        .platform-btn-small.xhs { color: #ff2442; border-color: rgba(255,36,66,0.2); }
        .platform-btn-small.douyin { color: #fff; border-color: rgba(255,255,255,0.15); }
        .platform-btn-small.yt { color: #ff4444; border-color: rgba(255,68,68,0.2); }
        .auth-modal-box .tab-switch { display: flex; background: rgba(255,255,255,0.06); border-radius: 3rem; padding: 0.3rem; margin-bottom: 1.5rem; gap: 0.25rem; }
        .auth-modal-box .tab-btn { flex: 1; text-align: center; padding: 0.6rem; font-size: 0.9rem; font-weight: 500; border-radius: 2.5rem; background: transparent; border: none; color: rgba(255,255,255,0.5); cursor: pointer; }
        .auth-modal-box .tab-btn.active { background: rgba(255,255,255,0.12); color: #fff; font-weight: 600; }
        .auth-modal-box .form-panel { display: block; }
        .auth-modal-box .form-panel.hidden { display: none; }
        .auth-modal-box .input-group { margin-bottom: 1rem; }
        .auth-modal-box .input-field { width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; font-size: 0.95rem; outline: none; background: rgba(255,255,255,0.05); color: #fff; }
        .auth-modal-box .input-field:focus { border-color: rgba(255,107,53,0.5); background: rgba(255,255,255,0.08); }
        .auth-modal-box .input-field::placeholder { color: rgba(255,255,255,0.3); }
        .auth-modal-box .action-btn { width: 100%; background: linear-gradient(135deg, #ff6b35, #f7931e); color: white; border: none; padding: 0.8rem; border-radius: 1rem; font-weight: 600; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
        .auth-modal-box .action-btn:hover { opacity: 0.9; }
        .auth-modal-box .action-btn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        .auth-modal-box .action-btn.danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .auth-modal-box .google-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.7rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 0.8rem; border-radius: 1rem; font-weight: 500; color: rgba(255,255,255,0.85); font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
        .auth-modal-box .google-btn:hover { background: rgba(255,255,255,0.1); }
        .auth-modal-box .message-box { text-align: center; font-size: 0.85rem; padding: 0.5rem; border-radius: 2rem; margin-bottom: 1rem; display: none; }
        .auth-modal-box .message-success { color: #34d399; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); display: block; }
        .auth-modal-box .message-error { color: #f87171; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); display: block; }
        .auth-modal-box .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .auth-modal-box .admin-btn-small { margin-top: 0.8rem; background: transparent; border: 1px solid rgba(255,255,255,0.1); padding: 0.5rem; border-radius: 1rem; width: 100%; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 0.85rem; display: none; }
        .admin-modal-box .modal-close { float: right; background: rgba(255,255,255,0.08); border: none; width: 32px; height: 32px; border-radius: 0.8rem; cursor: pointer; font-size: 1rem; color: rgba(255,255,255,0.5); }
        .admin-modal-box .modal-close:hover { background: rgba(255,255,255,0.15); }
        .admin-modal-box table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .admin-modal-box th, .admin-modal-box td { padding: 0.7rem 0.5rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); }
        .admin-modal-box th { color: rgba(255,255,255,0.4); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .admin-modal-box .delete-user-btn { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #f87171; padding: 0.3rem 0.7rem; border-radius: 0.6rem; cursor: pointer; font-size: 0.7rem; font-weight: 500; }
        .loading-spinner-full { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #ff6b35; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        .loading-box p { color: rgba(255,255,255,0.6); font-size: 1rem; font-weight: 500; margin: 0; }

        /* ===== 響應式 ===== */
        @media (max-width: 768px) {
            .hero-title { font-size: 2.2rem; }
            .hero-desc { font-size: 1rem; padding: 0 10px; }
            .maintenance-grid { grid-template-columns: 1fr; max-width: 320px; }
            .navbar { padding: 0 1rem; }
            .nav-links { gap: 1rem; }
            .nav-links a { font-size: 0.85rem; }
            .container { padding: 100px 16px 40px; }
            .hero-gear { width: 90px; height: 90px; }
            .gear-lg { width: 60px; height: 60px; }
            .gear-sm { width: 38px; height: 38px; }
            .modal-box, .auth-modal-box, .admin-modal-box, .loading-box { padding: 1.5rem; margin: 1rem; }
            .platform-grid-small { gap: 8px; }
            .platform-btn-small { padding: 10px 0; font-size: 0.85rem; }
        }
        @media (max-width: 480px) {
            .hero-title { font-size: 1.8rem; }
            .navbar { height: 60px; }
            .logo img { height: 36px; }
            .nav-right { gap: 0.6rem; }
            .nav-links { gap: 0.8rem; }
        }
    </style>

</head>
<body>

    <!-- ===== 導航欄 ===== -->
    <div class="navbar-wrapper">
        <nav class="navbar">
            <div class="logo">
                <a href="index.html"><img src="https://i.postimg.cc/HxVC7TcN/IMG-8863.png" alt="Logo"></a>
            </div>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="#" id="authNavLink" class="auth-link">登入</a></li>
                    <li>
                        <button class="avatar-btn" id="avatarBtn">
                            <div class="default-avatar" id="avatarPlaceholder">👤</div>
                            <img id="avatarImg" style="display:none;" alt="頭像">
                        </button>
                    </li>
                    <li><a href="#" id="contactBtn">聯繫我們</a></li>
                </ul>
            </div>
        </nav>
    </div>

    <!-- ===== 主要內容 - 維修中 ===== -->
    <div class="bg-particles" id="bgParticles"></div>
    <div class="container">
        <!-- 維修橫幅 -->
        <div class="maintenance-banner">
            <span>🔧</span> 網站暫停營運
        </div>

        <!-- 圖標 -->
        <div class="hero-gear">
            <svg class="gear gear-lg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.63c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.13-.22.07-.49-.12-.64l-2.01-1.63Z"/>
            </svg>
            <svg class="gear gear-sm" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.63c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.13-.22.07-.49-.12-.64l-2.01-1.63Z"/>
            </svg>
        </div>

        <!-- Hero 區 -->
        <section>
            <h1 class="hero-title">
                <span class="title-line">網站暫停營運</span>
                <span class="title-line title-accent">維修中</span>
            </h1>
            <p class="hero-desc">我們正在進行網站維護和升級，敬請稍候</p>
            <div class="status-badge">
                <span class="status-dot"></span>
                暫停服務
            </div>
        </section>

        <!-- 維修信息卡片 -->
        <section class="maintenance-section">
            <div class="maintenance-grid">
                <div class="maint-card">
                    <span class="maint-icon">🛠️</span>
                    <h3>正在維修</h3>
                    <p>技術團隊正在進行系統升級和維護</p>
                </div>
                <div class="maint-card">
                    <span class="maint-icon">⏰</span>
                    <h3>預計恢復</h3>
                    <p>敬請稍候，我們將盡快恢復服務</p>
                </div>
                <div class="maint-card">
                    <span class="maint-icon">💬</span>
                    <h3>聯繫我們</h3>
                    <p>如有急事請透過社交媒體聯繫</p>
                </div>
            </div>
        </section>

        <!-- 頁尾 -->
        <footer class="site-footer">
            <p>© 2026 梁喆同學 · 用 ❤️ 製作</p>
        </footer>
    </div>

    <!-- ===== 聯繫我們彈窗 ===== -->
    <div class="modal-overlay" id="contactModal">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="contact-info">
                <img src="https://i.postimg.cc/Z520m4jx/e1fb8ec8ae1db1ac50505adac82398e4.jpg" class="qq-icon">
                <div class="qq-label">QQ</div>

                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

    <!-- ===== 加載中彈窗 ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="loading-spinner-full"></div>
            <p id="loadingText">載入中...</p>
        </div>
    </div>

    <canvas id="avatarCanvas" width="420" height="420" style="display:none;"></canvas>

    <script>
        // ============================================================
        // 1. Firebase 配置（與子網站完全統一）
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCkJhI7FwrRNlNhPn9tp9w_aTKj--SUg7I",
            authDomain: "oscar-io-log-in.firebaseapp.com",
            projectId: "oscar-io-log-in",
            storageBucket: "oscar-io-log-in.firebasestorage.app",
            messagingSenderId: "51821788083",
            appId: "1:51821788083:web:bf9461f4fa3fd2bc07e9c6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ============================================================
        // 2. 加載彈窗控制
        // ============================================================
        let loadingTimer = null;
        function showLoading(text) {
            document.getElementById('loadingText').textContent = text || '載入中...';
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function hideLoading() {
            if (loadingTimer) return;
            loadingTimer = setTimeout(() => {
                document.getElementById('loadingOverlay').style.display = 'none';
                document.body.style.overflow = 'auto';
                loadingTimer = null;
            }, 500);
        }

        // ============================================================
        // 3. DOM 元素與管理員判斷
        // ============================================================
        const authNavLink = document.getElementById('authNavLink');
        const avatarBtn = document.getElementById('avatarBtn');
        const avatarImg = document.getElementById('avatarImg');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');

        const authModal = document.getElementById('authModal');
        const authPanel = document.getElementById('authPanel');
        const authLoggedInPanel = document.getElementById('authLoggedInPanel');
        const authDisplayName = document.getElementById('authDisplayName');
        const authDisplayEmail = document.getElementById('authDisplayEmail');
        const authLogoutBtn = document.getElementById('authLogoutBtn');
        const authAdminBtn = document.getElementById('authAdminBtn');

        const loginTabBtn = document.getElementById('loginTabBtn');
        const registerTabBtn = document.getElementById('registerTabBtn');
        const loginPanel = document.getElementById('loginPanel');
        const registerPanel = document.getElementById('registerPanel');
        const loginName = document.getElementById('loginName');
        const loginPassword = document.getElementById('loginPassword');
        const loginSubmit = document.getElementById('loginSubmitBtn');
        const loginMessage = document.getElementById('loginMessage');
        const regName = document.getElementById('regName');
        const regPassword = document.getElementById('regPassword');
        const regConfirmPassword = document.getElementById('regConfirmPassword');
        const registerSubmit = document.getElementById('registerSubmitBtn');
        const registerMessage = document.getElementById('registerMessage');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const googleRegisterBtn = document.getElementById('googleRegisterBtn');

        const adminModal = document.getElementById('adminModal');
        const closeAdminModal = document.getElementById('closeAdminModal');
        const userTableContainer = document.getElementById('userTableContainer');
        const avatarCanvas = document.getElementById('avatarCanvas');
        const avatarCtx = avatarCanvas.getContext('2d');

        function isAdmin(user) {
            if (!user) return false;
            return user.email === 'oscarmtr114514@gmail.com';
        }

        // ============================================================
        // 4. 頭像與 UI 控制函數
        // ============================================================
        function generateIdenticon(name) {
            const seed = name || 'default';
            const encoder = new TextEncoder();
            const data = encoder.encode(seed);
            let hash = BigInt('0xcbf29ce484222325');
            const prime = BigInt('0x100000001b3');
            for (let i = 0; i < data.length; i++) {
                hash ^= BigInt(data[i]);
                hash = (hash * prime) & BigInt('0xffffffffffffffff');
            }
            const bytes = new Uint8Array(8);
            for (let i = 0; i < 8; i++) bytes[7 - i] = Number((hash >> BigInt(i * 8)) & BigInt(0xff));
            const hue = (bytes[0] * 256 + bytes[1]) % 360;
            const sat = 70 + (bytes[2] % 20);
            const lig = 55 + (bytes[0] % 20);
            const bits = [];
            let bi = 3, bj = 0;
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    if (c < 3) {
                        const b = bytes[bi] || 0;
                        bits.push(((b >> (7 - bj)) & 1) === 1);
                        bj++; if (bj >= 8) { bj = 0; bi++; }
                    } else {
                        bits.push(bits[r * 3 + (4 - c)] || false);
                    }
                }
            }
            avatarCtx.clearRect(0, 0, 420, 420);
            avatarCtx.fillStyle = '#f5f5f5';
            avatarCtx.fillRect(0, 0, 420, 420);
            avatarCtx.fillStyle = `hsl(${hue}, ${sat}%, ${lig}%)`;
            for (let r = 0; r < 5; r++)
                for (let c = 0; c < 5; c++)
                    if (bits[r * 5 + c]) avatarCtx.fillRect(c * 84, r * 84, 84, 84);
            return avatarCanvas.toDataURL('image/png');
        }

        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'message-box message-' + type;
            setTimeout(() => { el.className = 'message-box'; el.textContent = ''; }, 4000);
        }

        function switchToLogin() {
            loginPanel.classList.remove('hidden');
            registerPanel.classList.add('hidden');
            loginTabBtn.classList.add('active');
            registerTabBtn.classList.remove('active');
        }
        function switchToRegister() {
            registerPanel.classList.remove('hidden');
            loginPanel.classList.add('hidden');
            registerTabBtn.classList.add('active');
            loginTabBtn.classList.remove('active');
        }

        function updateAvatar(photoUrl, name) {
            if (photoUrl && photoUrl.startsWith('http')) {
                avatarImg.src = photoUrl;
                avatarImg.style.display = 'block';
                avatarPlaceholder.style.display = 'none';
            } else {
                avatarImg.src = generateIdenticon(name || 'default');
                avatarImg.style.display = 'block';
                avatarPlaceholder.style.display = 'none';
            }
        }

        function showUI(user) {
            authNavLink.textContent = '登出';
            authNavLink.className = 'auth-link logout';
            authNavLink.removeEventListener('click', openAuthModal);
            authNavLink.removeEventListener('click', handleLogout);
            authNavLink.addEventListener('click', handleLogout);
            updateAvatar(user.photo, user.name);
            authPanel.style.display = 'none';
            authLoggedInPanel.style.display = 'block';
            authDisplayName.textContent = user.name || '使用者';
            authDisplayEmail.textContent = user.email || '';
            if (isAdmin(user)) {
                authAdminBtn.style.display = 'block';
            } else {
                authAdminBtn.style.display = 'none';
            }
            localStorage.setItem('currentUser', JSON.stringify(user));
            hideLoading();
        }

        function hideUI() {
            authNavLink.textContent = '登入';
            authNavLink.className = 'auth-link';
            authNavLink.removeEventListener('click', openAuthModal);
            authNavLink.removeEventListener('click', handleLogout);
            authNavLink.addEventListener('click', openAuthModal);
            avatarImg.style.display = 'none';
            avatarPlaceholder.style.display = 'flex';
            authPanel.style.display = 'block';
            authLoggedInPanel.style.display = 'none';
            localStorage.removeItem('currentUser');
            hideLoading();
        }

        function openAuthModal() {
            authModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeAuthModal() {
            authModal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function openAdminModalFn() {
            adminModal.classList.add('show');
            loadUserTable();
        }
        function closeAdminModalFn() {
            adminModal.classList.remove('show');
        }

        // ============================================================
        // 5. Firebase 認證功能
        // ============================================================
        async function googleLogin() {
            showLoading('Google 登入中...');
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                const u = result.user;
                const userData = { name: u.displayName, email: u.email, photo: u.photoURL, uid: u.uid };
                await db.ref('users/' + u.uid).set({ name: u.displayName, email: u.email, photo: u.photoURL, lastLogin: Date.now() });
                showUI(userData);
                closeAuthModal();
            } catch (e) {
                hideLoading();
                if (e.code !== 'auth/popup-closed-by-user') {
                    showMsg(loginMessage, 'Google 登入失敗：' + e.message, 'error');
                }
            }
        }

        async function handleRegister() {
            const name = regName.value.trim(), pw = regPassword.value, cf = regConfirmPassword.value;
            if (!name || !pw || !cf) { showMsg(registerMessage, '請填寫所有欄位', 'error'); return; }
            if (name.length < 2) { showMsg(registerMessage, '姓名至少2個字元', 'error'); return; }
            if (pw.length < 4) { showMsg(registerMessage, '密碼至少4個字元', 'error'); return; }
            if (pw !== cf) { showMsg(registerMessage, '密碼不一致', 'error'); return; }
            showLoading('註冊中...');
            registerSubmit.disabled = true;
            registerSubmit.innerHTML = '<span class="spinner"></span>註冊中...';
            try {
                const snap = await db.ref('users').orderByChild('name').equalTo(name).once('value');
                if (snap.exists()) { showMsg(registerMessage, '此姓名已被使用', 'error'); hideLoading(); registerSubmit.disabled = false; registerSubmit.textContent = '註冊'; return; }
                const avatar = generateIdenticon(name);
                const ref = db.ref('users').push();
                await ref.set({ name, password: pw, photo: avatar, createdAt: Date.now() });
                const ud = { name, email: '', photo: avatar, uid: ref.key };
                showUI(ud);
                closeAuthModal();
                regName.value = ''; regPassword.value = ''; regConfirmPassword.value = '';
            } catch (e) { showMsg(registerMessage, '註冊失敗', 'error'); hideLoading(); }
            finally { registerSubmit.disabled = false; registerSubmit.textContent = '註冊'; }
        }

        async function handleLogin() {
            const name = loginName.value.trim(), pw = loginPassword.value;
            if (!name || !pw) { showMsg(loginMessage, '請輸入姓名和密碼', 'error'); return; }
            showLoading('登入中...');
            loginSubmit.disabled = true;
            loginSubmit.innerHTML = '<span class="spinner"></span>登入中...';
            try {
                const snap = await db.ref('users').orderByChild('name').equalTo(name).once('value');
                if (!snap.exists()) { showMsg(loginMessage, '帳戶或密碼不正確', 'error'); hideLoading(); loginSubmit.disabled = false; loginSubmit.textContent = '登入'; return; }
                let found = false;
                snap.forEach(c => {
                    const d = c.val();
                    if (d.password === pw) {
                        found = true;
                        const ud = { name: d.name, email: d.email || '', photo: d.photo || '', uid: c.key };
                        showUI(ud);
                        closeAuthModal();
                        db.ref('users/' + c.key + '/lastLogin').set(Date.now());
                        loginName.value = ''; loginPassword.value = '';
                    }
                });
                if (!found) showMsg(loginMessage, '帳戶或密碼不正確', 'error');
                hideLoading();
            } catch (e) { showMsg(loginMessage, '帳戶或密碼不正確', 'error'); hideLoading(); }
            finally { loginSubmit.disabled = false; loginSubmit.textContent = '登入'; }
        }

        function handleLogout() {
            showLoading('登出中...');
            auth.signOut().catch(() => {});
            hideUI();
        }

        // ============================================================
        // 6. 用戶管理
        // ============================================================
        let allUsers = [];
        async function loadUserTable() {
            userTableContainer.innerHTML = '<p style="text-align:center;color:#6b7280;padding:2rem;">載入中...</p>';
            try {
                const snap = await db.ref('users').once('value');
                allUsers = [];
                if (snap.exists()) {
                    snap.forEach(c => {
                        const d = c.val();
                        if (d.name) allUsers.push({ key: c.key, ...d });
                    });
                }
                if (allUsers.length === 0) {
                    userTableContainer.innerHTML = '<p style="text-align:center;color:#6b7280;padding:2rem;">沒有任何用戶</p>';
                    return;
                }
                let html = `<table><thead><tr><th>姓名</th><th>Email</th><th>密碼</th><th>註冊時間</th><th>操作</th></tr></thead><tbody>`;
                allUsers.forEach((u) => {
                    const d = u.createdAt ? new Date(u.createdAt).toLocaleDateString('zh-HK') : '-';
                    const pwDisplay = u.password ? u.password : 'Google';
                    html += `<tr><td>${u.name}</td><td>${u.email || '-'}</td><td>${pwDisplay}</td><td>${d}</td><td><button class="delete-user-btn" onclick="window._deleteUser('${u.key}','${u.name.replace(/'/g, "\\'")}')"><i class="fas fa-trash"></i> 刪除</button></td></tr>`;
                });
                html += '</tbody></table>';
                userTableContainer.innerHTML = html;
            } catch (e) {
                userTableContainer.innerHTML = '<p style="text-align:center;color:#dc2626;padding:2rem;">載入失敗</p>';
            }
        }

        window._deleteUser = async function(key, name) {
            if (!confirm('確定要刪除用戶「' + name + '」嗎？此操作無法撤銷。')) return;
            try {
                await db.ref('users/' + key).remove();
                const local = JSON.parse(localStorage.getItem('currentUser') || 'null');
                if (local && local.uid === key) { hideUI(); }
                loadUserTable();
            } catch (e) { alert('刪除失敗：' + e.message); }
        };

        // ============================================================
        // 7. 事件綁定
        // ============================================================
        loginTabBtn.addEventListener('click', switchToLogin);
        registerTabBtn.addEventListener('click', switchToRegister);
        loginSubmit.addEventListener('click', handleLogin);
        registerSubmit.addEventListener('click', handleRegister);
        googleLoginBtn.addEventListener('click', googleLogin);
        googleRegisterBtn.addEventListener('click', googleLogin);
        authLogoutBtn.addEventListener('click', function() { handleLogout(); closeAuthModal(); });

        authNavLink.addEventListener('click', openAuthModal);

        avatarBtn.addEventListener('click', function() {
            const local = localStorage.getItem('currentUser');
            if (local) {
                openAuthModal();
                authPanel.style.display = 'none';
                authLoggedInPanel.style.display = 'block';
                const user = JSON.parse(local);
                authDisplayName.textContent = user.name || '使用者';
                authDisplayEmail.textContent = user.email || '';
                if (isAdmin(user)) {
                    authAdminBtn.style.display = 'block';
                } else {
                    authAdminBtn.style.display = 'none';
                }
            } else {
                openAuthModal();
            }
        });

        authAdminBtn.addEventListener('click', function() { closeAuthModal(); setTimeout(openAdminModalFn, 300); });
        authModal.addEventListener('click', function(e) { if (e.target === authModal) closeAuthModal(); });
        closeAdminModal.addEventListener('click', closeAdminModalFn);
        adminModal.addEventListener('click', function(e) { if (e.target === adminModal) closeAdminModalFn(); });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (adminModal.classList.contains('show')) closeAdminModalFn();
                if (authModal.style.display === 'flex') closeAuthModal();
            }
        });

        // ============================================================
        // 8. 聯繫我們
        // ============================================================
        const contactBtn = document.getElementById('contactBtn');
        const contactModal = document.getElementById('contactModal');

        contactBtn.addEventListener('click', function(e) {
            e.preventDefault();
            contactModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        });
        contactModal.addEventListener('click', function(e) {
            if (e.target === contactModal) {
                contactModal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        });

        // ============================================================
        // 9. 初始化
        // ============================================================
        function initAuth() {
            const local = localStorage.getItem('currentUser');
            if (local) {
                try { const user = JSON.parse(local); showUI(user); } catch (e) { hideUI(); }
            } else { hideUI(); }
        }
        auth.onAuthStateChanged(user => {
            if (user) {
                const ud = { name: user.displayName, email: user.email, photo: user.photoURL, uid: user.uid };
                localStorage.setItem('currentUser', JSON.stringify(ud));
                showUI(ud);
            }
        });
        initAuth();
    </script>

    <script>
        // 背景粒子
        (function() {
            const container = document.getElementById('bgParticles');
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 80 + 30;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 15 + 10) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(p);
            }
        })();
    </script>
