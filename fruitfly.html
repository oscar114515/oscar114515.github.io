<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta name="mnd-ver" content="tlr5gwjihbdf9nqy1inwfa" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>果蠅花園 · Fruit Fly Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', sans-serif; color: #fff; }
  #canvas-container { position: fixed; inset: 0; }
  #ui-panel {
    position: fixed;
    top: 20px; left: 20px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px 24px;
    max-width: 320px;
    z-index: 100;
  }
  #ui-panel h1 {
    font-size: 1.3rem;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ff6b6b, #feca57);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #ui-panel p { font-size: 0.85rem; color: #aaa; line-height: 1.6; margin-bottom: 12px; }
  #ui-panel .stats { font-size: 0.8rem; color: #888; margin-top: 10px; }
  #hint {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 0.85rem;
    color: #aaa;
    z-index: 100;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  #loading {
    position: fixed; inset: 0;
    background: #0a0a1a;
    display: flex; justify-content: center; align-items: center;
    z-index: 999; font-size: 1.2rem; color: #feca57;
  }
  #loading.hidden { display: none; }
</style>
</head>
<body>
<div id="loading">載入 3D 花園中...</div>
<div id="canvas-container"></div>

<div id="ui-panel">
  <h1>🪰 果蠅花園</h1>
  <p>花園中生長著許多神經元。只有一個是「真的」——來自果蠅大腦的真實數據。其餘都是由 AI 生成的模擬。</p>
  <p>🔍 滑鼠拖曳旋轉 | 滾輪縮放 | 點擊神經元查看详情</p>
  <div class="stats" id="stats"></div>
</div>

<div id="hint">拖曳旋轉 · 滾輪縮放 · 點擊探索</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== 初始化場景 =====
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.02);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 15, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 2, 0);

// ===== 光照 =====
scene.add(new THREE.AmbientLight(0x404060, 0.6));
const dirLight = new THREE.DirectionalLight(0xfff0c0, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);
const purpleLight = new THREE.PointLight(0x9b59b6, 0.5, 50);
purpleLight.position.set(-8, 5, -8);
scene.add(purpleLight);

// ===== 地面（花園）=====
const groundGeo = new THREE.CircleGeometry(30, 64);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x1a3a1a,
  roughness: 1,
  metalness: 0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 花草
for (let i = 0; i < 60; i++) {
  const ang = Math.random() * Math.PI * 2;
  const r = 5 + Math.random() * 20;
  const x = Math.cos(ang) * r;
  const z = Math.sin(ang) * r;
  const h = 0.5 + Math.random() * 2;
  const hue = 0.2 + Math.random() * 0.15;
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.04, h, 6),
    new THREE.MeshStandardMaterial({ color: 0x2d5a2d })
  );
  stem.position.set(x, h/2, z);
  scene.add(stem);
  // 花朵
  const flower = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 8, 6),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(hue, 0.7, 0.6),
      emissive: new THREE.Color().setHSL(hue, 0.5, 0.3),
      emissiveIntensity: 0.3
    })
  );
  flower.position.set(x, h + 0.1, z);
  scene.add(flower);
}

// ===== 神經元生成 =====
function createNeuron(seed, isReal) {
  const group = new THREE.Group();
  const color = isReal
    ? new THREE.Color(0xffd700)  // 金色 = 真實
    : new THREE.Color().setHSL(0.55 + Math.random() * 0.15, 0.6, 0.55); // 藍綠 = 模擬

  // 隨機種子
  const rng = () => {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  };

  // 神經元胞體（細胞體）
  const somaGeo = new THREE.IcosahedronGeometry(0.35, 2);
  const somaMat = new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: isReal ? 0.4 : 0.15,
    metalness: 0.3,
    roughness: 0.4
  });
  const soma = new THREE.Mesh(somaGeo, somaMat);
  group.add(soma);

  // 軸突和樹突（分支結構）
  const branchCount = 4 + Math.floor(rng() * 5);
  for (let b = 0; b < branchCount; b++) {
    const branchLen = 1.5 + rng() * 3;
    const dir = new THREE.Vector3(
      rng() * 2 - 1,
      rng() * 0.5,
      rng() * 2 - 1
    ).normalize();

    const points = [new THREE.Vector3(0, 0, 0)];
    let pos = new THREE.Vector3(0, 0, 0);
    const segments = 8 + Math.floor(rng() * 8);

    for (let s = 0; s < segments; s++) {
      const offset = new THREE.Vector3(
        (rng() - 0.5) * 0.4,
        (rng() - 0.3) * 0.3,
        (rng() - 0.5) * 0.4
      );
      pos.addScaledVector(dir, branchLen / segments).add(offset);
      points.push(pos.clone());
    }

    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({
      color: color,
      transparent: true,
      opacity: isReal ? 0.9 : 0.5
    });
    const line = new THREE.Line(geo, mat);
    group.add(line);

    // 子分支
    const subBranches = 2 + Math.floor(rng() * 3);
    for (let sb = 0; sb < subBranches; sb++) {
      const subPoints = [points[Math.floor(points.length * 0.6)].clone()];
      let subPos = subPoints[0].clone();
      const subDir = new THREE.Vector3(
        rng() - 0.5, rng() - 0.5, rng() - 0.5
      ).normalize();
      for (let s = 0; s < 4; s++) {
        subPos.addScaledVector(subDir, 0.4);
        subPoints.push(subPos.clone());
      }
      const subGeo = new THREE.BufferGeometry().setFromPoints(subPoints);
      const subLine = new THREE.Line(subGeo, mat);
      group.add(subLine);
    }
  }

  return group;
}

// ===== 生成神經元花園 =====
const neurons = [];
const neuronCount = 25;

// 一個真的
neurons.push({
  group: createNeuron(12345, true),
  isReal: true,
  name: "Drosophila Connectome #001",
  desc: "來自果蠅大腦真實 Connectome 數據的神經元。這是在 2024 年由 FlyWire 聯盟通過 AI + 人類協同驗證完成的完整果蠅大腦connectome中的第 001 號神經元。"
});

// 其餘假的
for (let i = 0; i < neuronCount - 1; i++) {
  neurons.push({
    group: createNeuron(100000 + i * 7853, false),
    isReal: false,
    name: `模擬神經元 #${String(i+1).padStart(3,'0')}`,
    desc: "由 AI 生成的模擬神經元結構。雖然外觀相似，但不具備真實神經元的電生理特性。"
  });
}

// 隨機分布在花園中
neurons.forEach((n, i) => {
  const ang = (i / neuronCount) * Math.PI * 2 + Math.random() * 0.5;
  const r = 3 + Math.random() * 8;
  n.group.position.set(
    Math.cos(ang) * r,
    0.5 + Math.random() * 1.5,
    Math.sin(ang) * r
  );
  n.group.rotation.y = Math.random() * Math.PI * 2;
  scene.add(n.group);
});

// ===== 點擊交互 =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const infoBox = document.createElement('div');
infoBox.style.cssText = `
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(10,10,26,0.95);
  border: 2px solid #ffd700;
  border-radius: 16px;
  padding: 24px 32px;
  max-width: 400px;
  z-index: 200;
  display: none;
  text-align: center;
`;
infoBox.innerHTML = `
  <h2 id="info-name" style="color:#ffd700;margin-bottom:8px;"></h2>
  <p id="info-desc" style="color:#ccc;font-size:0.9rem;line-height:1.6;margin-bottom:12px;"></p>
  <button id="info-close" style="background:#ffd700;border:none;padding:8px 20px;border-radius:20px;cursor:pointer;font-weight:600;">關閉</button>
`;
document.body.appendChild(infoBox);

document.getElementById('info-close').addEventListener('click', () => {
  infoBox.style.display = 'none';
});

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const meshes = [];
  neurons.forEach(n => {
    n.group.traverse(child => {
      if (child.isMesh) meshes.push(child);
    });
  });

  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) {
    // 找到所屬的神經元
    let hitNeuron = null;
    for (const n of neurons) {
      if (n.group.contains(hits[0].object)) {
        hitNeuron = n;
        break;
      }
    }
    if (hitNeuron) {
      document.getElementById('info-name').textContent =
        (hitNeuron.isReal ? '🌟 ' : '') + hitNeuron.name;
      document.getElementById('info-desc').textContent = hitNeuron.desc;
      infoBox.style.display = 'block';
    }
  }
});

// ===== 動畫 =====
const clock = new THREE.Clock();
const stats = document.getElementById('stats');

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // 神經元輕微浮動
  neurons.forEach((n, i) => {
    n.group.position.y += Math.sin(clock.elapsedTime * 0.5 + i) * 0.002;
    n.group.rotation.y += dt * 0.2;
  });

  controls.update();
  renderer.render(scene, camera);

  stats.textContent = `神經元: ${neuronCount} | 真實: 1 | 模擬: ${neuronCount - 1}`;
}

// 隐藏 loading
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 800);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
