        function isAdmin(user) {

        function generateIdenticon(name) {
            const seed = name || 'default';
            const encoder = new TextEncoder();
            const data = encoder.encode(seed);
            let hash = BigInt('0xcbf29ce484222325');
            const prime = BigInt('0x100000001b3');
            for (let i = 0; i < data.length; i++) {
                hash ^= BigInt(data[i]);
                hash = (hash * prime) & BigInt('0xffffffffffffffff');
            }
            const bytes = new Uint8Array(8);
            for (let i = 0; i < 8; i++) bytes[7 - i] = Number((hash >> BigInt(i * 8)) & BigInt(0xff));
            const hue = (bytes[0] * 256 + bytes[1]) % 360;
            const sat = 70 + (bytes[2] % 20);
            const lig = 55 + (bytes[0] % 20);
            const bits = [];
            let bi = 3, bj = 0;
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    if (c < 3) {
                        const b = bytes[bi] || 0;
                        bits.push(((b >> (7 - bj)) & 1) === 1);
                        bj++; if (bj >= 8) { bj = 0; bi++; }
                    } else { bits.push(bits[4 - c]); }
                }
            }
            const size = 100, cell = size / 5;
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 5 5">`;
            svg += `<rect width="5" height="5" fill="hsl(${hue},${sat}%,${lig}%)" rx="1"/>`;
            bits.forEach((b, i) => {
                const col = i % 5, row = Math.floor(i / 5);
                if (b) svg += `<rect x="${col}" y="${row}" width="1" height="1" fill="white"/>`;
            });
            svg += '</svg>';
            return 'data:image/svg+xml;base64,' + btoa(svg);
        }

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text || '載入中...';
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function showUI(user) {
            authNavLink.textContent = '登出';
            authNavLink.className = 'auth-link logout';
            authNavLink.removeEventListener('click', openAuthModal);
            authNavLink.addEventListener('click', handleLogout);
            updateAvatar(user.photo, user.name);
            authPanel.style.display = 'none';
            authLoggedInPanel.style.display = 'block';
            authDisplayName.textContent = user.name || '使用者';
            authDisplayEmail.textContent = user.email || '';
            if (isAdmin(user)) { authAdminBtn.style.display = 'block'; }
            else { authAdminBtn.style.display = 'none'; }
            localStorage.setItem('currentUser', JSON.stringify(user));
            hideLoading();
        }
        function hideUI() {
            authNavLink.textContent = '登入';
            authNavLink.className = 'auth-link';
            authNavLink.removeEventListener('click', openAuthModal);
            authNavLink.addEventListener('click', openAuthModal);
            avatarImg.style.display = 'none';
            avatarPlaceholder.style.display = 'flex';
            authPanel.style.display = 'block';
            authLoggedInPanel.style.display = 'none';
            localStorage.removeItem('currentUser');
            hideLoading();
        }
        function updateAvatar(url, name) {
            if (url) { avatarImg.src = url; avatarImg.style.display = 'block'; avatarPlaceholder.style.display = 'none'; }
            else { avatarImg.src = generateIdenticon(name); avatarImg.style.display = 'block'; avatarPlaceholder.style.display = 'none'; }
        }
        function openAuthModal() { authModal.style.display = 'flex'; document.body.style.overflow = 'hidden'; }
        function closeAuthModal() { authModal.style.display = 'none'; document.body.style.overflow = 'auto'; }
        function openAdminModalFn() { adminModal.classList.add('show'); loadUserTable(); }
        function closeAdminModalFn() { adminModal.classList.remove('show'); }

        async function googleLogin() {
            showLoading('Google 登入中...');
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                const u = result.user;
                const userData = { name: u.displayName, email: u.email, photo: u.photoURL, uid: u.uid };
                await db.ref('users/' + u.uid).set({ name: u.displayName, email: u.email, photo: u.photoURL, lastLogin: Date.now() });
                showUI(userData);
                closeAuthModal();
            } catch (e) {
                hideLoading();
                if (e.code !== 'auth/popup-closed-by-user') {
                    showMsg(loginMessage, 'Google 登入失敗：' + e.message, 'error');
                }
            }
        }
        async function handleRegister() {
            const name = regName.value.trim(), pw = regPassword.value, cf = regConfirmPassword.value;
            if (!name || !pw || !cf) { showMsg(registerMessage, '請填寫所有欄位', 'error'); return; }
            if (name.length < 2) { showMsg(registerMessage, '姓名至少2個字元', 'error'); return; }
            if (pw.length < 4) { showMsg(registerMessage, '密碼至少4個字元', 'error'); return; }
            if (pw !== cf) { showMsg(registerMessage, '密碼不一致', 'error'); return; }
            showLoading('註冊中...');
            registerSubmitBtn.disabled = true;
            registerSubmitBtn.innerHTML = '<span class="spinner"></span>註冊中...';
            try {
                const snap = await db.ref('users').orderByChild('name').equalTo(name).once('value');
                if (snap.exists()) { showMsg(registerMessage, '此姓名已被使用', 'error'); hideLoading(); registerSubmitBtn.disabled = false; registerSubmitBtn.textContent = '註冊'; return; }
                const avatar = generateIdenticon(name);
                const ref = db.ref('users').push();
                await ref.set({ name, password: pw, photo: avatar, createdAt: Date.now() });
                const ud = { name, email: '', photo: avatar, uid: ref.key };
                showUI(ud);
                closeAuthModal();
                regName.value = ''; regPassword.value = ''; regConfirmPassword.value = '';
            } catch (e) { showMsg(registerMessage, '註冊失敗', 'error'); hideLoading(); }
            finally { registerSubmitBtn.disabled = false; registerSubmitBtn.textContent = '註冊'; }
        }
        async function handleLogin() {
            const name = loginName.value.trim(), pw = loginPassword.value;
            if (!name || !pw) { showMsg(loginMessage, '請輸入姓名和密碼', 'error'); return; }
            showLoading('登入中...');
            loginSubmitBtn.disabled = true;
            loginSubmitBtn.innerHTML = '<span class="spinner"></span>登入中...';
            try {
                const snap = await db.ref('users').orderByChild('name').equalTo(name).once('value');
                if (!snap.exists()) { showMsg(loginMessage, '帳戶或密碼不正確', 'error'); hideLoading(); loginSubmitBtn.disabled = false; loginSubmitBtn.textContent = '登入'; return; }
                let found = false;
                snap.forEach(c => {
                    const d = c.val();
                    if (d.password === pw) {
                        found = true;
                        const ud = { name: d.name, email: d.email || '', photo: d.photo || '', uid: c.key };
                        showUI(ud);
                        closeAuthModal();
                        db.ref('users/' + c.key + '/lastLogin').set(Date.now());
                        loginName.value = ''; loginPassword.value = '';
                    }
                });
                if (!found) showMsg(loginMessage, '帳戶或密碼不正確', 'error');
                hideLoading();
            } catch (e) { showMsg(loginMessage, '帳戶或密碼不正確', 'error'); hideLoading(); }
            finally { loginSubmitBtn.disabled = false; loginSubmitBtn.textContent = '登入'; }
        }
        function handleLogout() { showLoading('登出中...'); auth.signOut().catch(() => {}); hideUI(); }
        function showMsg(el, msg, type) { el.textContent = msg; el.className = 'message-box ' + type; setTimeout(() => { el.textContent = ''; el.className = 'message-box'; }, 3000); }
        let allUsers = [];
        async function loadUserTable() {
            userTableContainer.innerHTML = '<p style="text-align:center;color:#6b7280;padding:2rem;">載入中...</p>';
            try {
                const snap = await db.ref('users').once('value');
                allUsers = [];
                if (snap.exists()) { snap.forEach(c => { const d = c.val(); if (d.name) allUsers.push({ key: c.key, ...d }); }); }
                if (allUsers.length === 0) { userTableContainer.innerHTML = '<p style="text-align:center;color:#6b7280;padding:2rem;">沒有任何用戶</p>'; return; }
                let html = `<table><thead><tr><th>姓名</th><th>Email</th><th>密碼</th><th>註冊時間</th><th>操作</th></tr></thead><tbody>`;
                allUsers.forEach((u) => {
                    const d = u.createdAt ? new Date(u.createdAt).toLocaleDateString('zh-HK') : '-';
                    const pwDisplay = u.password ? u.password : 'Google';
                    html += `<tr><td>${u.name}</td><td>${u.email || '-'}</td><td>${pwDisplay}</td><td>${d}</td><td><button class="delete-user-btn" onclick="window._deleteUser('${u.key}','${u.name.replace(/'/g, "\\'")}')"><i class="fas fa-trash"></i> 刪除</button></td></tr>`;
                });
                html += '</tbody></table>';
                userTableContainer.innerHTML = html;
            } catch (e) { userTableContainer.innerHTML = '<p style="text-align:center;color:#dc2626;padding:2rem;">載入失敗</p>'; }
        }
        window._deleteUser = async function(key, name) {
            if (!confirm('確定要刪除用戶「' + name + '」嗎？此操作無法撤銷。')) return;
            try {
                await db.ref('users/' + key).remove();
                const local = JSON.parse(localStorage.getItem('currentUser') || 'null');
                if (local && local.uid === key) { hideUI(); }
                loadUserTable();
            } catch (e) { alert('刪除失敗：' + e.message); }
        };

        // ===== QR Code 功能 =====
        function generateQR(text, fgColor, bgColor) {
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');

            try {
                // 使用 qrcode-generator 庫生成 QR 碼
                // 自動選擇錯誤修正級別和尺寸
                const byteLength = new TextEncoder().encode(text).length;
                let qrTypeNo = 1;

                // QR 版本容量 (L 級別，字節)
                const capacity = [17, 32, 53, 78, 106, 139, 176, 220, 268, 324, 386, 442, 514, 582, 658, 728, 808, 908, 984, 1084, 1188, 1296, 1408, 1524, 1644, 1768, 1876, 2012, 2152, 2300, 2452, 2620, 2764, 2932, 3100, 3280, 3468, 3664, 3868, 4084];

                for (let i = 0; i < capacity.length; i++) {
                    if (byteLength <= capacity[i]) {
                        qrTypeNo = i + 1;
                        break;
                    }
                    if (i === capacity.length - 1) {
                        alert('內容太長，請縮短文字。QR 碼最多支援約 4084 字節。');
                        return;
                    }
                }

                const qr = qrcode(qrTypeNo, 'L');
                qr.addData(text);
                qr.make();

                const moduleCount = qr.getModuleCount();
                // 計算合適的畫布大小
                const cellSize = 12;
                const quietZone = cellSize * 4;
                const canvasSize = moduleCount * cellSize + quietZone * 2;

                canvas.width = canvasSize;
                canvas.height = canvasSize;

                // 繪製背景
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 繪製模組
                ctx.fillStyle = fgColor;
                for (let row = 0; row < moduleCount; row++) {
                    for (let col = 0; col < moduleCount; col++) {
                        if (qr.isDark(row, col)) {
                            ctx.fillRect(
                                col * cellSize + quietZone,
                                row * cellSize + quietZone,
                                cellSize,
                                cellSize
                            );
                        }
                    }
                }

                // 確保結果顯示
                document.getElementById('qrResult').classList.add('show');

                // 更新下載按鈕
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.href = canvas.toDataURL('image/png');
            } catch (e) {
                console.error('QR生成錯誤:', e);
                alert('生成 QR 碼失敗：' + e.message);
            }
        }

        document.getElementById('generateBtn').addEventListener('click', () => {
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                alert('請輸入內容');
                return;
            }
            const fgColor = document.getElementById('fgColor').value;
            const bgColor = document.getElementById('bgColor').value;

            generateQR(text, fgColor, bgColor);
        });

        // ===== 初始化 =====
        auth.onAuthStateChanged(user => {
            if (user) {
                const ud = { name: user.displayName, email: user.email, photo: user.photoURL, uid: user.uid };
                localStorage.setItem('currentUser', JSON.stringify(ud));
                showUI(ud);
            } else {
                hideUI();
            }
        });

        const contactBtn = document.getElementById('contactBtn');
        const contactModal = document.getElementById('contactModal');
        contactBtn.addEventListener('click', function(e) { e.preventDefault(); contactModal.style.display = 'flex'; document.body.style.overflow = 'hidden'; });
        contactModal.addEventListener('click', function(e) { if (e.target === contactModal) { contactModal.style.display = 'none'; document.body.style.overflow = 'auto'; } });
        authNavLink.addEventListener('click', openAuthModal);
        authLogoutBtn.addEventListener('click', handleLogout);
        authAdminBtn.addEventListener('click', function() { closeAuthModal(); setTimeout(openAdminModalFn, 300); });
        authModal.addEventListener('click', function(e) { if (e.target === authModal) closeAuthModal(); });
        closeAdminModal.addEventListener('click', closeAdminModalFn);
        adminModal.addEventListener('click', function(e) { if (e.target === adminModal) closeAdminModalFn(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (adminModal.classList.contains('show')) closeAdminModalFn();
                if (authModal.style.display === 'flex') closeAuthModal();
                if (contactModal.style.display === 'flex') { contactModal.style.display = 'none'; document.body.style.overflow = 'auto'; }
            }
        });
        const loginTabBtn = document.getElementById('loginTabBtn');
        const registerTabBtn = document.getElementById('registerTabBtn');
        const loginPanel = document.getElementById('loginPanel');
        const registerPanel = document.getElementById('registerPanel');
        loginTabBtn.addEventListener('click', () => { loginPanel.classList.remove('hidden'); registerPanel.classList.add('hidden'); loginTabBtn.classList.add('active'); registerTabBtn.classList.remove('active'); });
        registerTabBtn.addEventListener('click', () => { registerPanel.classList.remove('hidden'); loginPanel.classList.add('hidden'); registerTabBtn.classList.add('active'); loginTabBtn.classList.remove('active'); });
        loginSubmitBtn.addEventListener('click', handleLogin);
        registerSubmitBtn.addEventListener('click', handleRegister);
        googleLoginBtn.addEventListener('click', googleLogin);
        googleRegisterBtn.addEventListener('click', googleLogin);
    </script>
</body>
</html>
