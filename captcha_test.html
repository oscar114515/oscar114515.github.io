<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script async src="https://ss.mrmnd.com/static/8e6e2b64-e447-4835-9383-b3690481621b.js"></script>
    <meta name="mnd-ver" content="tlr5gwjihbdf9nqy1inwfa" />
    <meta name="google-site-verification" content="Fo87PV4l8qknvf02W0c2541TD76fU8hgqG0DtjcAA_Y">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7041222551434229" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>验证码测试 · OpenCaptcha 集成</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 1.5rem;
    text-align: center;
    margin-bottom: 6px;
    color: #333;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 28px;
  }
  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 0.9rem;
    color: #555;
  }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    transition: border 0.2s;
  }
  input:focus { outline: none; border-color: #667eea; }
  .captcha-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    margin-bottom: 6px;
  }
  .captcha-row img {
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    flex-shrink: 0;
  }
  .refresh-btn {
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 0.9rem;
    color: #555;
    transition: background 0.2s;
  }
  .refresh-btn:hover { background: #e0e0e0; }
  .captcha-input { width: 100%; }
  .submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 8px;
  }
  .submit-btn:hover { opacity: 0.9; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg {
    text-align: center;
    margin-top: 16px;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .msg.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  .msg.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  .hint {
    font-size: 0.78rem;
    color: #aaa;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 註冊測試</h1>
    <p class="subtitle">OpenCaptcha 驗證碼整合演示</p>

    <form id="testForm">
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" placeholder="請輸入姓名" required>
      </div>

      <div class="form-group">
        <label for="password">設定密碼</label>
        <input type="password" id="password" placeholder="請設定密码" required minlength="6">
      </div>

      <div class="form-group">
        <label for="confirmPassword">確認密码</label>
        <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
      </div>

      <div class="form-group">
        <label>驗證碼</label>
        <div class="captcha-row">
          <img id="captchaImage" alt="验证码" width="200" height="60">
          <button type="button" class="refresh-btn" id="refreshBtn">🔄 重新生成</button>
        </div>
        <input type="text" id="captchaInput" class="captcha-input" placeholder="請輸入圖片中的字符" required>
        <div class="hint">點擊圖片或按鈕可重新整理</div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">註冊</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

<script>
(function() {
  // 生成 4 位大寫字母 + 數字的隨機字串
  function generateCaptchaText() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 排除容易混淆的 O/0/I/1
    let result = '';
    for (let i = 0; i < 4; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

  let expectedCaptcha = '';

  function loadCaptcha() {
    expectedCaptcha = generateCaptchaText();
    const img = document.getElementById('captchaImage');
    // 加 timestamp 防止浏览器缓存
    img.src = 'https://api.opencaptcha.io/captcha?text=' + encodeURIComponent(expectedCaptcha) + '&t=' + Date.now();
  }

  document.getElementById('refreshBtn').addEventListener('click', loadCaptcha);
  document.getElementById('captchaImage').addEventListener('click', loadCaptcha);

  function showMessage(text, isError) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = 'msg ' + (isError ? 'error' : 'success');
  }

  document.getElementById('testForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const captchaInput = document.getElementById('captchaInput').value.trim().toUpperCase();

    if (!name) { showMessage('請輸入姓名', true); return; }
    if (password.length < 6) { showMessage('密码至少 6 位', true); return; }
    if (password !== confirmPassword) { showMessage('两次密码不一致', true); return; }
    if (captchaInput !== expectedCaptcha) {
      showMessage('驗證碼错误，請重試', true);
      loadCaptcha();
      document.getElementById('captchaInput').value = '';
      return;
    }

    showMessage('✅ 註冊成功！姓名：' + name, false);
    document.getElementById('submitBtn').disabled = true;
  });

  // 初始加載
  loadCaptcha();
})();
</script>
</body>
</html>
